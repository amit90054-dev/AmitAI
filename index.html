<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AmitAI</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 520px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #111827;
    }
    header {
      padding: 18px;
      background: #172033;
      border-bottom: 1px solid #2b3548;
    }
    header h1 { margin: 0; font-size: 24px; }
    header p { margin: 5px 0 0; color: #9ca3af; font-size: 13px; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .msg {
      max-width: 85%;
      padding: 11px 14px;
      margin: 9px 0;
      border-radius: 15px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user {
      margin-left: auto;
      background: #2563eb;
    }
    .ai {
      margin-right: auto;
      background: #263244;
    }
    .bottom {
      padding: 10px;
      display: flex;
      gap: 8px;
      background: #172033;
      border-top: 1px solid #2b3548;
    }
    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      border-radius: 12px;
      padding: 12px;
      background: #263244;
      color: white;
      min-height: 48px;
      max-height: 120px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 0 17px;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }
    button:disabled { opacity: .5; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>🤖 AmitAI</h1>
    <p>Your personal AI assistant</p>
  </header>

  <div id="chat">
    <div class="msg ai">Namaste! 👋 Main AmitAI hoon. Aap kya poochna chahte hain?</div>
  </div>

  <div class="bottom">
    <textarea id="input" placeholder="AmitAI se kuch poochiye..."></textarea>
    <button id="send">Send</button>
  </div>
</div>

<script>
  // STEP 1: Paste your Supabase Publishable Key here.
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_NM7SkDBSbu8Hiq-mam5I7g_9sTD5iiT";

  // STEP 2: Your deployed Supabase Edge Function URL.
  const FUNCTION_URL = "https://cbzsilgfswbiivybvpof.supabase.co/functions/v1/rapid-service";

  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function askAmitAI() {
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, "user");
    input.value = "";
    send.disabled = true;
    send.textContent = "...";

    try {
      const response = await fetch(FUNCTION_URL, {
        method: "POST",
       headers: {
  "Content-Type": "application/json",
  "apikey": SUPABASE_PUBLISHABLE_KEY
},
        body: JSON.stringify({ message })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error?.message || data.error || "Request failed");
      }

      addMessage(data.reply || "No response received.", "ai");
    } catch (error) {
      addMessage("Error: " + error.message, "ai");
    } finally {
      send.disabled = false;
      send.textContent = "Send";
      input.focus();
    }
  }

  send.addEventListener("click", askAmitAI);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      askAmitAI();
    }
  });
</script>
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js");
    });
  }
</script>
</body>
</html>
